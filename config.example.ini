[project]
name = Financial Agentic RAG

[mysql]
host = 127.0.0.1
port = 3306
user = YOUR_MYSQL_USER
password = YOUR_MYSQL_PASSWORD
database = financial_qa
faq_table = financial_faq
conversation_table = financial_conversations

[redis]
host = 127.0.0.1
port = 6379
password = YOUR_REDIS_PASSWORD
db = 1
key_prefix = financial:

[milvus]
host = 127.0.0.1
port = 19530
database_name = financial
collection_name = financial_rag_v1

[llm]
model = qwen3.8-max
dashscope_api_key = YOUR_API_KEY
dashscope_base_url = YOUR_DASHSCOPE_BASE_URL

[models]
bge_m3_model_path = YOUR_MODEL_PATH
reranker_model_path = YOUR_MODEL_PATH
bert_router_model_path = YOUR_MODEL_PATH
bert_base_model_path = YOUR_MODEL_PATH
document_segmentation_model_path = YOUR_MODEL_PATH

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 30
candidate_m = 3

[app]
host = 0.0.0.0
port = 8001
valid_sources = ["annual_reports", "financial_knowledge"]
customer_service_phone = YOUR_SUPPORT_PHONE

[logger]
log_file = logs/app.log
